<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>ملاحظ الباص – FMS Lite (Mobile)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--bg:#0b1020;--card:#101826;--ink:#e7edf6;--muted:#9fb0c8;--line:#233046;--ok:#22c55e;--ok2:#38bdf8;--danger:#ef4444}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui}
header{position:sticky;top:0;z-index:10;padding:10px 12px;background:#0c1222;border-bottom:1px solid #1e293b;display:flex;gap:8px;align-items:center;justify-content:space-between}
select,button{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0c1424;color:var(--ink);font-size:16px}
button.primary{background:linear-gradient(135deg,var(--ok),var(--ok2));border:none;font-weight:700}
button.danger{background:var(--danger);border:none;font-weight:700}
button.neutral{background:#0c1424;border:1px solid var(--line);font-weight:700}
.container{display:grid;grid-template-columns:1fr;gap:12px;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
#map{height:360px;border-radius:12px;border:1px solid var(--line)}
.student{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px dashed #2a3a51;padding:10px 0}
.btns{display:flex;gap:6px}
.btns button{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0c1424;color:var(--ink)}
.btns button.ok{background:linear-gradient(135deg,var(--ok),var(--ok2));border:none}
.btns button.danger{background:var(--danger);border:none}
.small{font-size:12px;color:var(--muted)}
.locked{opacity:.6;pointer-events:none}
.footer{position:sticky;bottom:0;padding:8px;background:#0c1222;border-top:1px solid #1e293b;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.bar{display:flex;gap:8px}
</style>
</head>
<body>
<header>
  <div style="font-weight:700">🚍 ملاحظ الباص</div>
  <div class="bar" style="flex:1">
    <select id="bus_pick" aria-label="اختر الباص" onchange="pickBus()"></select>
    <select id="period_pick" aria-label="اختر الفترة" onchange="onPeriodChange()">
      <option value="">الفترة…</option>
      <option value="morning">صباحي</option>
      <option value="evening">مسائي</option>
    </select>
  </div>
</header>

<div class="container">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0;font-size:16px">الخريطة والمسار</h3>
      <div class="small">* تأكد من منح إذن الموقع</div>
    </div>
    <div id="map"></div>
    <div class="hint">عند الضغط على «تفعيل التتبع» يبدأ إرسال GPS ويظهر موقع الباص في لوحة المشرف مباشرة.</div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px 0;font-size:16px">الطلاب</h3>
    <div id="students" class="small">اختر الباص ثم اختر الفترة لعرض الطلاب…</div>
  </div>
</div>

<div class="footer">
  <button id="startBtn" class="primary" onclick="ensurePermissionAndStart()" disabled>تفعيل التتبّع</button>
  <button id="stopBtn" class="danger" onclick="stopTracking()" disabled>إيقاف</button>
  <button id="doneBtn" class="neutral" onclick="finalizePeriod()" disabled>تم</button>
</div>

<script>
/* ===== Supabase ===== */
const SUPABASE_URL = "https://vdolempilbsofmriaohf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkb2xlbXBpbGJzb2Ztcmlhb2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0NDU1ODcsImV4cCI6MjA3NzAyMTU4N30.OOHmiasyaXS8Rz_xpmrCIonwc8wRclLqNjrrG2J4ckw";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===== State ===== */
let map, myMarker=null, pathLine=null, pathPts=[];
let watchId=null, lastPos=null, pushTimer=null;
let myBus=null, currentPeriod='', loadedStudents=[];
let frozen={morning:new Set(), evening:new Set()}; // يُجمّد فقط بعد الضغط
let observerName='—';
const $ = sel => document.querySelector(sel);

/* ===== Helpers ===== */
function saveSelection(){
  localStorage.setItem('fms.bus_id', myBus?.id ? String(myBus.id) : '');
  localStorage.setItem('fms.period', currentPeriod || '');
}
function loadSelection(){
  const bid = localStorage.getItem('fms.bus_id');
  const per = localStorage.getItem('fms.period');
  return { bid: bid ? Number(bid) : null, per: per || '' };
}
function arabicPeriod(p){ return p==='morning'?'صباحية': p==='evening'?'مسائية':'—'; }

/* ===== Map ===== */
function initMap(){
  map = L.map('map',{zoomControl:false}).setView([25.285,51.531], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
}

/* ===== Load buses + restore selection ===== */
async function loadBusList(){
  const { data, error } = await client.from('buses').select('id, school_bus_no').order('school_bus_no');
  if(error){ alert(error.message); return; }
  $('#bus_pick').innerHTML = `<option value="">اختر الباص…</option>`+(data||[]).map(b=>`<option value="${b.id}">${b.school_bus_no}</option>`).join('');

  const { bid, per } = loadSelection();
  if(bid){
    $('#bus_pick').value = String(bid);
    myBus = { id: bid };
    await fetchObserverName();
  }
  if(per){ $('#period_pick').value = per; currentPeriod = per; }
  updateFooterButtonsState();
  if(myBus?.id && currentPeriod){ await loadStudents(); renderStudents(); }
  else if(myBus?.id){ $('#students').textContent = 'اختر الفترة…'; }
}

/* ===== Observer name for message ===== */
async function fetchObserverName(){
  observerName = '—';
  if(!myBus?.id) return;
  const { data: bus } = await client.from('buses').select('observer_id').eq('id', myBus.id).maybeSingle();
  if(bus?.observer_id){
    const { data: prof } = await client.from('profiles').select('full_name').eq('id', bus.observer_id).maybeSingle();
    if(prof?.full_name) observerName = prof.full_name;
  }
}

/* ===== Changes ===== */
async function pickBus(){
  const val = $('#bus_pick').value;
  myBus = val ? { id: Number(val) } : null;
  await fetchObserverName();
  saveSelection();
  updateFooterButtonsState();

  if(!myBus){ $('#students').textContent = 'اختر الباص…'; return; }
  if(currentPeriod){ await loadStudents(); renderStudents(); }
  else{ $('#students').textContent = 'اختر الفترة…'; }
}
async function onPeriodChange(){
  currentPeriod = $('#period_pick').value || '';
  saveSelection();
  updateFooterButtonsState();

  // لا تجميد من القاعدة — فقط بعد الضغط
  frozen.morning.clear(); frozen.evening.clear();

  if(!myBus?.id || !currentPeriod){ $('#students').textContent = 'اختر الباص ثم الفترة…'; return; }
  await loadStudents(); renderStudents();
}

/* ===== Students ===== */
async function loadStudents(){
  const { data: rows, error } = await client
    .from('student_bus')
    .select('student_id, students(id, full_name, home_lat, home_lng)')
    .eq('bus_id', myBus.id);
  if(error){ alert(error.message); return; }
  loadedStudents = (rows||[]).map(r=>r.students).filter(Boolean);
}
function renderStudents(){
  const wrap = $('#students');
  if(!myBus?.id || !currentPeriod){ wrap.textContent='اختر الباص ثم الفترة…'; return; }
  wrap.innerHTML = (loadedStudents||[]).map(s=>{
    const locked = frozen[currentPeriod].has(s.id) ? 'locked' : '';
    const gmap = (s.home_lat && s.home_lng) ? `<a class="small" target="_blank" href="https://www.google.com/maps/?q=${s.home_lat},${s.home_lng}">ملاحة</a>` : '';
    return `<div class="student ${locked}" id="stu_${s.id}">
      <div>
        <div><b>${s.full_name}</b></div>
        <div class="small">${s.home_lat??''} ${s.home_lng??''} ${gmap}</div>
      </div>
      <div class="btns">
        <button class="ok" onclick="confirmAndMark(${s.id},'board')">صعود</button>
        <button class="ok" onclick="confirmAndMark(${s.id},'alight')">نزول</button>
        <button class="danger" onclick="confirmAndMark(${s.id},'absent')">غائب</button>
      </div>
    </div>`;
  }).join('') || '<div class="small">لا يوجد طلاب لهذا الباص.</div>';
}

/* ===== Attendance (freeze only after click) ===== */
async function confirmAndMark(student_id, action){
  if(!myBus?.id) return alert('اختر الباص أولاً');
  if(!currentPeriod) return alert('اختر الفترة');
  if(frozen[currentPeriod].has(student_id)) return;

  const actTxt = action==='board'?'صعود': action==='alight'?'نزول':'غياب';
  if(!confirm(`تأكيد ${actTxt} الطالب؟`)) return;

  const { error } = await client.from('attendance_events').insert({
    student_id, bus_id: myBus.id, period: currentPeriod, action
  });
  if(error){ alert(error.message); return; }

  frozen[currentPeriod].add(student_id);
  const row = document.getElementById(`stu_${student_id}`); if(row) row.classList.add('locked');
}

/* ===== GPS controls ===== */
async function ensurePermissionAndStart(){
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    alert('لتفعيل الـGPS يجب فتح الصفحة عبر HTTPS أو على localhost.');
    return;
  }
  if(!('geolocation' in navigator)){ alert('المتصفح لا يدعم GPS'); return; }
  try{
    if('permissions' in navigator && navigator.permissions?.query){
      const st = await navigator.permissions.query({name:'geolocation'});
      if(st.state==='denied'){ alert('يرجى منح إذن الموقع من إعدادات المتصفح'); return; }
    }
  }catch(_){}
  startTracking();
}
function startTracking(){
  if(!myBus?.id){ alert('اختر الباص أولاً'); return; }
  if(watchId!==null) return;

  watchId = navigator.geolocation.watchPosition(onPos, onErr, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 15000
  });
  pushTimer = setInterval(async ()=>{
    if(lastPos && myBus?.id){
      await sendFix(lastPos.coords.latitude, lastPos.coords.longitude);
    }
  }, 10000);

  $('#startBtn').disabled = true;
  $('#stopBtn').disabled  = false;
}
function stopTracking(){
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  if(pushTimer){ clearInterval(pushTimer); pushTimer=null; }
  $('#startBtn').disabled = false;
  $('#stopBtn').disabled  = true;
}
async function onPos(pos){
  lastPos = pos;
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  if(!myMarker){ myMarker = L.marker([lat,lng]).addTo(map).bindTooltip('موقع الباص'); }
  else myMarker.setLatLng([lat,lng]);

  pathPts.push([lat,lng]);
  if(pathLine){ pathLine.setLatLngs(pathPts); }
  else pathLine = L.polyline(pathPts,{weight:4,opacity:.9}).addTo(map);

  await sendFix(lat, lng);
}
function onErr(err){
  console.log('GPS error', err);
  if(err.code === 1) alert('تم رفض إذن الموقع. فعّل الإذن من إعدادات المتصفح.');
  else if(err.code === 2) alert('تعذر الحصول على الإحداثيات. تحقّق من GPS.');
  else if(err.code === 3) alert('انتهى وقت طلب الموقع. حاول مرة أخرى.');
}
async function sendFix(lat, lng){
  const { error } = await client.from('gps_tracks').insert({ bus_id: myBus.id, lat, lng });
  if(error){ console.error('Supabase insert error:', error); }
}

/* ===== Done button ===== */
function finalizePeriod(){
  if(!myBus?.id || !currentPeriod){ alert('اختر الباص والفترة أولاً'); return; }
  stopTracking(); // إيقاف مؤقت
  alert(`انتهت الفترة ${arabicPeriod(currentPeriod)} — شكرًا لك ${observerName} 🌟`);
}

/* ===== Footer state ===== */
function updateFooterButtonsState(){
  const hasBus = !!myBus?.id;
  $('#startBtn').disabled = !hasBus;
  $('#stopBtn').disabled  = (watchId===null);
  $('#doneBtn').disabled  = !(hasBus && !!currentPeriod);
}

/* ===== Boot ===== */
(async ()=>{
  initMap();
  await loadBusList();
  updateFooterButtonsState();
})();
</script>
</body></html>
